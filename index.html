<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Service Helper</h1>
  <input id="nameBox" placeholder="Generator name">
  <input id="runBox" type="number" placeholder="Running hr">
  <input id="nextBox" type="number" placeholder="Next PM hr">
  <input id="pendingBox" placeholder="Pending items">
  <input id="siteBox" placeholder="Site">

  <button onclick="addGen()">Add</button>
  <button onclick="updateGen()">Update</button>
  <button onclick="findGen()">Find</button>
  <button onclick="savePending()">Save pending</button>
  <button onclick="pmDone()">PM done</button>
  <button onclick="clearPending()">Clear Pending</button>

  <input id="hrDayBox" type="number" placeholder="Hr per day">

  <button onclick="setHrPerDay()">Set hr/day</button>
  <button onclick="showUrgentGen()">Show urgent</button>
  <button onclick="showOverGen()">Show Over</button>
  <button onclick="showAllGen()">Show all</button>
  <button onclick="showSiteGen()">Show site</button>
  <button onclick="urgentParts()">Urgent parts</button>
  <button onclick="siteSummary()">Site summary</button>
  <button onclick="nextJob()">Next Job</button>
  <button onclick="pendingList()">Pending List</button>
  <button onclick="changeSite()">Change Site</button>

  <p id="msg"></p>

  <table id="pmTable" border="1"></table>

  <p id="summary"></p>

  <script>
    let gens = JSON.parse(localStorage.getItem("pmTable"));
    if (gens === null) {
      gens = [
        { name: "G01", runningHr: 1200, nextPmHr: 1250, pending: "" },
        { name: "G02", runningHr: 2010, nextPmHr: 2000, pending: "Top hose" },
        { name: "G03", runningHr: 500, nextPmHr: 500, pending: "" }
      ];
    };
    let hrPerDay = 10;
    let saveHr = localStorage.getItem("hrPerDay");
    if (saveHr !== null) {
      hrPerDay = Number(saveHr);
    };

    let showMode = "all";

    let siteFilter = "";


    function getPmStatus(gen) {
      let hrLeft = gen.nextPmHr - gen.runningHr;
      if (hrLeft < 0) {
        return (0 - hrLeft) + " hr over";
      } else if (hrLeft === 0) {
        return "PM due now";
      } else if (hrLeft <= 50) {
        return hrLeft + " hr left, PM soon";
      } else {
        return hrLeft + " hr left";
      };// 
    };//getPmStatus(gens[0])

    function showTable() {
      //headerStart
      let rows = "<tr> <th>Generator</th> <th>Site</th> <th>Running Hr</th> <th>Next PM</th> <th>Days left</th> <th>Status</th> <th>Pending</th> <th>Last PM</th> <th></th> <th></th> <th></th> <th></th> </tr>";
      //headerEnd
      let over = 0;
      let dueNow = 0;
      let soon = 0;
      let pendingCount = 0;

      for (let i = 0; i < gens.length; i++) {
        let hrLeft = gens[i].nextPmHr - gens[i].runningHr;
        let daysLeft = Math.floor(hrLeft / hrPerDay);
        if (hrLeft < 0) {
          daysLeft = "-";
        };

        if (showMode === "urgent" && hrLeft > 50) {
          continue;
        };

        if (showMode === "over" && hrLeft >= 0) {
          continue;
        };

        if (siteFilter !== "" && gens[i].site !== siteFilter) {
          continue;
        };

        //rowsStart
        let rowStart = "<tr>";
        if (hrLeft < 0) {
          rowStart = "<tr style = 'background-color: #f8c8c8'>";
        } else if (hrLeft === 0) {
          rowStart = "<tr style = 'background-color: #fde0b8'>";
        } else if (hrLeft <= 50) {
          rowStart = "<tr style = 'background-color: #fff3b0'>";
        };
        rows = rows + rowStart;
        rows = rows + "<td>" + gens[i].name + "</td>";

        let site = gens[i].site;
        if (site === undefined) {
          site = "-";
        } else if (site === "") {
          site = "-";
        };
        rows = rows + "<td>" + site + "</td>";

        rows = rows + "<td>" + gens[i].runningHr + "</td>";
        rows = rows + "<td>" + gens[i].nextPmHr + "</td>";
        rows = rows + "<td>" + daysLeft + "</td>";
        rows = rows + "<td>" + getPmStatus(gens[i]) + "</td>";

        let pending = gens[i].pending;
        if (pending === undefined) {
          pending = "-";
        } else if (pending === "") {
          pending = "-";
        };
        if (pending !== "-") {
          pendingCount = pendingCount + 1;
        };
        rows = rows + "<td>" + pending + "</td>";
        let lastPm = gens[i].lastPm;
        if (lastPm === undefined) {
          lastPm = "-";
        };
        rows = rows + "<td>" + lastPm + "</td>";

        rows = rows + "<td><button onclick='deleteGen(" + i + ")'>delete</button></td>";
        rows = rows + "<td><button onclick='clearRow(" + i + ")'>clear</button></td>";
        rows = rows + "<td><button onclick='waText(" + i + ")'>WA</button></td>";
        rows = rows + "<td><button onclick='partsList(" + i + ")'>Parts</button></td>";

        rows = rows + "</tr>";
        //rowsEnd

        if (hrLeft < 0) {
          over = over + 1;
        } else if (hrLeft === 0) {
          dueNow = dueNow + 1;
        } else if (hrLeft <= 50) {
          soon = soon + 1;
        };
      };//for
      document.getElementById("pmTable").innerHTML = rows;
      document.getElementById("summary").textContent = "Over: " + over + " | Due now: " + dueNow + " | Soon: " + soon + " | Pending: " + pendingCount;
    };//showTable()
    showTable();

    function addGen() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let runningHr = document.getElementById("runBox").value;
      let nextPmHr = document.getElementById("nextBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (runningHr === "") {
        document.getElementById("msg").textContent = "Please write running hours";
        return;
      };
      if (nextPmHr === "") {
        document.getElementById("msg").textContent = "Please write next PM hours";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          document.getElementById("msg").textContent = name + " already in list";
          return;
        };
      };//for
      let newGen = {
        name: name,
        runningHr: Number(document.getElementById("runBox").value),
        nextPmHr: Number(document.getElementById("nextBox").value),
        pending: document.getElementById("pendingBox").value,
        site: document.getElementById("siteBox").value
      };
      gens.push(newGen);
      localStorage.setItem("pmTable", JSON.stringify(gens));
      showTable();
      document.getElementById("msg").textContent = name + " added";
      document.getElementById("nameBox").value = "";
      document.getElementById("runBox").value = "";
      document.getElementById("nextBox").value = "";
      document.getElementById("pendingBox").value = "";
      document.getElementById("siteBox").value = "";

    };//addGen()

    function updateGen() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let runningHr = document.getElementById("runBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (runningHr === "") {
        document.getElementById("msg").textContent = "Please write running hours";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].runningHr = Number(document.getElementById("runBox").value);
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " updated";
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//updateGen()

    function deleteGen(i) {
      let name = gens[i].name;
      gens.splice(i, 1);
      localStorage.setItem("pmTable", JSON.stringify(gens));
      showTable();
      document.getElementById("msg").textContent = name + " deleted";
    };//deleteGen()

    function findGen() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          let pmCount = gens[i].pmCount;
          if (pmCount === undefined) {
            pmCount = 0;
          };
          let lastPm = gens[i].lastPm;
          if (lastPm === undefined) {
            lastPm = "-";
          };
          document.getElementById("msg").textContent = name + ": " + getPmStatus(gens[i]) + " | PMs done: " + pmCount + " | Last PM: " + lastPm;
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//findGen()

    function savePending() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let pendingNameBox = document.getElementById("pendingBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (pendingNameBox === "") {
        document.getElementById("msg").textContent = "Please write pending items";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].pending = document.getElementById("pendingBox").value;
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " pending saved";
          document.getElementById("nameBox").value = "";
          document.getElementById("pendingBox").value = "";
          return;
        };
      };//for
      document.getElementById("msg").textContent = "Not found";
    };//savePending()

    //pmDone()
    function pmDone() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let runBox = document.getElementById("runBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (runBox === "") {
        document.getElementById("msg").textContent = "Please write running hours";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].runningHr = Number(document.getElementById("runBox").value);
          gens[i].nextPmHr = Number(document.getElementById("runBox").value) + 250;
          let today = new Date().toLocaleDateString("en-GB");
          gens[i].lastPm = today;
          if (gens[i].pmCount === undefined) {
            gens[i].pmCount = 1;
          } else {
            gens[i].pmCount = gens[i].pmCount + 1;
          };
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " PM done, next PM at " + gens[i].nextPmHr;
          document.getElementById("nameBox").value = "";
          document.getElementById("runBox").value = "";
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//pmDone()

    function clearPending() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].pending = "";
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " pending cleared";
          document.getElementById("nameBox").value = "";
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//clearPending()

    function clearRow(i) {
      let name = gens[i].name;
      gens[i].pending = "";
      localStorage.setItem("pmTable", JSON.stringify(gens));
      showTable();
      document.getElementById("msg").textContent = name + " pending cleared";
    };//clearRow()

    function waText(i) {
      let name = gens[i].name;
      let site = gens[i].site;
      let today = new Date().toLocaleDateString("en-GB");
      if (site === undefined) {
        document.getElementById("msg").textContent = name + ", service done on " + today + ".";
        return;
      } else if (site === "") {
        document.getElementById("msg").textContent = name + ", service done on " + today + ".";
        return;
      } else {
        document.getElementById("msg").textContent = name + ", service done on " + today + ". Site: " + site + ".";
      };
    };//waText()

    function partsList(i) {
      let name = gens[i].name;
      let parts = "O, OF, DF";
      let pending = gens[i].pending;
      if (pending !== undefined && pending !== "") {
        parts = parts + " + " + pending;
      };
      document.getElementById("msg").textContent = name + " PM parts: " + parts;
    };//partsList(i)

    function urgentParts() {
      let count = 0;
      let pendingList = "";
      for (let i = 0; i < gens.length; i++) {
        let hrLeft = Number(gens[i].nextPmHr - gens[i].runningHr);
        if (hrLeft <= 50) {
          count = count + 1;
          if (gens[i].pending !== undefined && gens[i].pending !== "") {
            pendingList = pendingList + gens[i].name + ": " + gens[i].pending + ". ";
          };
        };
      };// for
      if (count === 0) {
        document.getElementById("msg").textContent = "No urgent PM";
        return;
      };
      document.getElementById("msg").textContent = "Urgent PM: " + count + " gens. Need: O x" + count + ", OF x" + count + ", DF x" + count + ". Pending: " + pendingList;
    };//urgentParts()

    function siteSummary() {
      let site = document.getElementById("siteBox").value;
      if (site === "") {
        document.getElementById("msg").textContent = "Please write site name";
        return;
      };
      let total = 0;
      let urgent = 0;
      for (let i = 0; i < gens.length; i++) {
        if (site === gens[i].site) {
          total = total + 1;
          let hrLeft = Number(gens[i].nextPmHr - gens[i].runningHr);
          if (hrLeft <= 50) {
            urgent = urgent + 1;
          };
        };
      };//for
      if (total === 0) {
        document.getElementById("msg").textContent = "No generator at " + site;
        return
      };
      document.getElementById("msg").textContent = site + ": " + total + " gens, " + urgent + " urgent";
    };//siteSummary()

    function nextJob() {
      if (gens.length === 0) {
        document.getElementById("msg").textContent = "No generator";
        return;
      };
      let bestI = 0;
      let bestLeft = Number(gens[0].nextPmHr - gens[0].runningHr);
      for (let i = 0; i < gens.length; i++) {
        let hrLeft = Number(gens[i].nextPmHr - gens[i].runningHr);
        if (hrLeft < bestLeft) {
          bestLeft = hrLeft;
          bestI = i;
        };
      };//for
      document.getElementById("msg").textContent = "Next PM: " + gens[bestI].name + ", " + getPmStatus(gens[bestI]);
    };//nextJob()

    //pendingList()
    function pendingList() {
      let count = 0;
      let list = "";
      for (let i = 0; i < gens.length; i++) {
        if (gens[i].pending !== undefined && gens[i].pending !== "") {
          count = count + 1;
          list = list + gens[i].name + ": " + gens[i].pending + ". ";
        };
      };//for
      if (count === 0) {
        document.getElementById("msg").textContent = "No pending";
        return;
      };
      document.getElementById("msg").textContent = "Pending ( " + count + " ): " + list;
    };
    //pendingList()

    //changeSite()
    function changeSite() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let site = document.getElementById("siteBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Write generator name";
        return;
      };
      if (site === "") {
        document.getElementById("msg").textContent = "Write site name";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (gens[i].name === name) {
          gens[i].site = site;
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " site: " + site;
          document.getElementById("nameBox").value = "";
          document.getElementById("siteBox").value = "";
          return;
        };
      };//for
      document.getElementById("msg").textContent = "Not found";
    };
    //changeSite()

    function setHrPerDay() {
      let hrDay = document.getElementById("hrDayBox").value;
      if (hrDay === "") {
        document.getElementById("msg").textContent = "Please write hours per day";
        return;
      };
      if (Number(hrDay) <= 0) {
        document.getElementById("msg").textContent = "Hours must be more than 0";
        return;
      };
      hrPerDay = Number(hrDay);
      localStorage.setItem("hrPerDay", JSON.stringify(hrPerDay));
      showTable();
      document.getElementById("msg").textContent = "Hr per day set to " + hrPerDay;
      document.getElementById("hrDayBox").value = "";
    };//setHrPerDay()

    function showUrgentGen() {
      showMode = "urgent";
      showTable();
      document.getElementById("msg").textContent = "Showing urgent only";
    };//showUrgentGen()

    //showOverGen()
    function showOverGen() {
      showMode = "over";
      showTable();
      document.getElementById("msg").textContent = "Showing over only";

    };
    //showOverGen()

    function showAllGen() {
      showMode = "all";
      siteFilter = "";
      showTable();
      document.getElementById("msg").textContent = "Showing all";
    };//showAllGen()

    function showSiteGen() {
      let siteName = document.getElementById("siteBox").value;
      if (siteName === "") {
        document.getElementById("msg").textContent = "Please write site name";
        return;
      };
      siteFilter = document.getElementById("siteBox").value;
      showTable();
      document.getElementById("msg").textContent = "Showing site " + siteFilter;
      document.getElementById("siteBox").value = "";
    };//showSiteGen


  </script>

</body>

</html>
