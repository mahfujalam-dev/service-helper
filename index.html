<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Service Helper</h1>
  <input id="nameBox">
  <input id="runBox" type="number">
  <input id="nextBox" tupe="number">
  <button onclick="addGen()">Add</button>
  <p id="msg"></p>
  <table id="pmTable" border="1"></table>
  <script>
    let gens = JSON.parse(localStorage.getItem("pmTable"));
    if (gens === null) {
      gens = [
        { name: "G01", runningHr: 1200, nextPmHr: 1250 },
        { name: "G02", runningHr: 2010, nextPmHr: 2000 },
        { name: "G03", runningHr: 500, nextPmHr: 500 }
      ];
    };

    function getPmStatus(gen) {
      let hrLeft = gen.nextPmHr - gen.runningHr;
      if (hrLeft < 0) {
        return (0 - hrLeft) + " hr over";
      } else if (hrLeft === 0) {
        return "PM due now";
      } else if (hrLeft <= 50) {
        return hrLeft + " hr left, PM soon";
      } else {
        return hrLeft + " hr left";
      };// 
    };//getPmStatus(gens[0])

    function showTable() {
      let rows = "<tr><th>Generator</th><th>Running Hr</th><th>Next PM</th><th>Status</th><th></th></tr>";
      for (let i = 0; i < gens.length; i++) {
        rows = rows + "<tr>";
        rows = rows + "<td>" + gens[i].name + "</td>";
        rows = rows + "<td>" + gens[i].runningHr + "</td>";
        rows = rows + "<td>" + gens[i].nextPmHr + "</td>";
        rows = rows + "<td>" + getPmStatus(gens[i]) + "</td>";
        rows = rows + "<td><button onclick='deleteGen()'>delete</button></td>"
        rows = rows + "</tr>";
      };//for
      document.getElementById("pmTable").innerHTML = rows;
    };//showTable()
    showTable()
  </script>

</body>

</html>
