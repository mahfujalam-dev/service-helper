<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Service Helper</h1>
  <input id="nameBox">
  <input id="runBox" type="number">
  <input id="nextBox" type="number">
  <input id="pendingBox">
  <button onclick="addGen()">Add</button>
  <button onclick="updateGen()">Update</button>
  <button onclick="findGen()">Find</button>
  <button onclick="savePending()">Save pending</button>
  <button onclick="pmDone()">PM done</button>
  <button onclick="clearPending()">Clear Pending</button>
  <p id="msg"></p>
  <table id="pmTable" border="1"></table>
  <p id="summary"></p>
  <script>
    let gens = JSON.parse(localStorage.getItem("pmTable"));
    if (gens === null) {
      gens = [
        { name: "G01", runningHr: 1200, nextPmHr: 1250, pending: "" },
        { name: "G02", runningHr: 2010, nextPmHr: 2000, pending: "Top hose" },
        { name: "G03", runningHr: 500, nextPmHr: 500, pending: "" }
      ];
    };

    function getPmStatus(gen) {
      let hrLeft = gen.nextPmHr - gen.runningHr;
      if (hrLeft < 0) {
        return (0 - hrLeft) + " hr over";
      } else if (hrLeft === 0) {
        return "PM due now";
      } else if (hrLeft <= 50) {
        return hrLeft + " hr left, PM soon";
      } else {
        return hrLeft + " hr left";
      };// 
    };//getPmStatus(gens[0])

    function showTable() {
      let rows = "<tr><th>Generator</th><th>Running Hr</th><th>Next PM</th><th>Status</th><th>Pending</th><th></th></tr>";
      let over = 0;
      let dueNow = 0;
      let soon = 0;
      for (let i = 0; i < gens.length; i++) {
        rows = rows + "<tr>";
        rows = rows + "<td>" + gens[i].name + "</td>";
        rows = rows + "<td>" + gens[i].runningHr + "</td>";
        rows = rows + "<td>" + gens[i].nextPmHr + "</td>";
        rows = rows + "<td>" + getPmStatus(gens[i]) + "</td>";
        let pending = gens[i].pending;
        if (pending === undefined) {
          pending = "-";
        } else if (pending === "") {
          pending = "-";
        };
        rows = rows + "<td>" + pending + "</td>";
        rows = rows + "<td><button onclick='deleteGen(" + i + ")'>delete</button></td>";
        rows = rows + "</tr>";
        let hrLeft = gens[i].nextPmHr - gens[i].runningHr;
        if (hrLeft < 0) {
          over = over + 1;
        } else if (hrLeft === 0) {
          dueNow = dueNow + 1;
        } else if (hrLeft <= 50) {
          soon = soon + 1;
        };
      };//for
      document.getElementById("pmTable").innerHTML = rows;
      document.getElementById("summary").textContent = "Over: " + over + " | Due now: " + dueNow + " | Soon: " + soon;
    };//showTable()
    showTable();

    function addGen() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let runningHr = document.getElementById("runBox").value;
      let nextPmHr = document.getElementById("nextBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (runningHr === "") {
        document.getElementById("msg").textContent = "Please write running hours";
        return;
      };
      if (nextPmHr === "") {
        document.getElementById("msg").textContent = "Please write next PM hours";
        return;
      };
      let newGen = {
        name: name,
        runningHr: Number(document.getElementById("runBox").value),
        nextPmHr: Number(document.getElementById("nextBox").value)
      };
      gens.push(newGen);
      localStorage.setItem("pmTable", JSON.stringify(gens));
      showTable();
      document.getElementById("msg").textContent = name + " added";
      document.getElementById("nameBox").value = "";
      document.getElementById("runBox").value = "";
      document.getElementById("nextBox").value = "";
    };//addGen()

    function updateGen() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let runningHr = document.getElementById("runBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (runningHr === "") {
        document.getElementById("msg").textContent = "Please write running hours";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].runningHr = Number(document.getElementById("runBox").value);
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " updated";
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//updateGen()

    function deleteGen(i) {
      let name = gens[i].name;
      gens.splice(i, 1);
      localStorage.setItem("pmTable", JSON.stringify(gens));
      showTable();
      document.getElementById("msg").textContent = name + " deleted";
    };//deleteGen()

    function findGen() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          document.getElementById("msg").textContent = name + ": " + getPmStatus(gens[i]);
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//findGen()

    function savePending() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let pendingNameBox = document.getElementById("pendingBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (pendingNameBox === "") {
        document.getElementById("msg").textContent = "Please write pending items";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].pending = document.getElementById("pendingBox").value;
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " pending saved";
          document.getElementById("nameBox").value = "";
          document.getElementById("pendingBox").value = "";
          return;
        };
      };//for
      document.getElementById("msg").textContent = "Not found";
    };//savePending()

    function pmDone() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      let runBox = document.getElementById("runBox").value;
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      if (runBox === "") {
        document.getElementById("msg").textContent = "Please write running hours";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].runningHr = Number(document.getElementById("runBox").value);
          gens[i].nextPmHr = Number(document.getElementById("runBox").value) + 250;
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " PM done, next PM at " + gens[i].nextPmHr;
          document.getElementById("nameBox").value = "";
          document.getElementById("runBox").value = "";
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//pmDone()

    function clearPending() {
      let name = document.getElementById("nameBox").value.toUpperCase();
      if (name === "") {
        document.getElementById("msg").textContent = "Please write generator name";
        return;
      };
      for (let i = 0; i < gens.length; i++) {
        if (name === gens[i].name) {
          gens[i].pending = "";
          localStorage.setItem("pmTable", JSON.stringify(gens));
          showTable();
          document.getElementById("msg").textContent = name + " pending cleared";
          document.getElementById("nameBox").value = "";
          return;
        };
      };// for
      document.getElementById("msg").textContent = "Not found";
    };//clearPending()
  </script>

</body>

</html>
